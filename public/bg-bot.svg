<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b3d"/>
      <stop offset="45%" stop-color="#0f4c81"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="980" cy="120" r="180" fill="#f59e0b" opacity="0.18"/>
  <circle cx="180" cy="640" r="220" fill="#ec4899" opacity="0.18"/>
  <circle cx="620" cy="380" r="260" fill="#22d3ee" opacity="0.12"/>

  <!-- floating emails -->
  <g opacity="0.9" filter="url(#softGlow)">
    <g transform="translate(760,220) rotate(12)">
      <rect x="-55" y="-36" rx="10" width="110" height="72" fill="#ffffff" opacity="0.95"/>
      <path d="M-55 -36 L0 8 L55 -36" fill="none" stroke="#6366f1" stroke-width="6"/>
      <path d="M-55 36 L-12 0 M55 36 L12 0" stroke="#a78bfa" stroke-width="5"/>
    </g>
    <g transform="translate(900,360) rotate(-8)">
      <rect x="-50" y="-32" rx="10" width="100" height="64" fill="#ffe082" opacity="0.95"/>
      <path d="M-50 -32 L0 6 L50 -32" fill="none" stroke="#f59e0b" stroke-width="6"/>
    </g>
    <g transform="translate(700,430) rotate(18)">
      <rect x="-45" y="-28" rx="8" width="90" height="56" fill="#bfdbfe" opacity="0.95"/>
      <path d="M-45 -28 L0 4 L45 -28" fill="none" stroke="#3b82f6" stroke-width="5"/>
    </g>
    <g transform="translate(1020,520) rotate(-15)">
      <rect x="-48" y="-30" rx="9" width="96" height="60" fill="#fbcfe8" opacity="0.95"/>
      <path d="M-48 -30 L0 5 L48 -30" fill="none" stroke="#ec4899" stroke-width="5"/>
    </g>
  </g>

  <!-- search beam -->
  <path d="M470 360 L760 220 L820 520 Z" fill="#67e8f9" opacity="0.18"/>
  <path d="M470 360 L760 220 L820 520" fill="none" stroke="#67e8f9" stroke-width="3" opacity="0.5"/>

  <!-- AI bot -->
  <g transform="translate(320,360)">
    <!-- antenna -->
    <line x1="0" y1="-150" x2="0" y2="-190" stroke="#e0e7ff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="-205" r="16" fill="#f43f5e"/>
    <circle cx="0" cy="-205" r="28" fill="#f43f5e" opacity="0.25"/>
    <!-- head -->
    <rect x="-120" y="-150" rx="36" ry="36" width="240" height="170" fill="url(#glow)" stroke="#e0e7ff" stroke-width="6"/>
    <!-- eyes -->
    <circle cx="-45" cy="-80" r="26" fill="#0b1020"/>
    <circle cx="45" cy="-80" r="26" fill="#0b1020"/>
    <circle cx="-38" cy="-86" r="8" fill="#67e8f9"/>
    <circle cx="52" cy="-86" r="8" fill="#67e8f9"/>
    <!-- mouth/screen -->
    <rect x="-55" y="-35" rx="12" width="110" height="28" fill="#0b1020" opacity="0.7"/>
    <rect x="-40" y="-24" rx="6" width="50" height="6" fill="#34d399"/>
    <rect x="16" y="-24" rx="6" width="24" height="6" fill="#fbbf24"/>
    <!-- body -->
    <rect x="-95" y="35" rx="28" width="190" height="150" fill="#1e293b" stroke="#93c5fd" stroke-width="6"/>
    <rect x="-55" y="70" rx="10" width="110" height="18" fill="#38bdf8"/>
    <rect x="-55" y="100" rx="10" width="80" height="14" fill="#a78bfa"/>
    <rect x="-55" y="126" rx="10" width="95" height="14" fill="#34d399"/>
    <!-- arms -->
    <rect x="-150" y="55" rx="18" width="45" height="90" fill="#334155"/>
    <rect x="105" y="55" rx="18" width="45" height="90" fill="#334155"/>
    <!-- magnifier searching emails -->
    <circle cx="185" cy="40" r="46" fill="none" stroke="#fde68a" stroke-width="10"/>
    <circle cx="185" cy="40" r="34" fill="#67e8f9" opacity="0.25"/>
    <line x1="150" y1="75" x2="118" y2="108" stroke="#fde68a" stroke-width="12" stroke-linecap="round"/>
    <rect x="160" y="22" rx="4" width="34" height="22" fill="#fff" opacity="0.95"/>
    <path d="M160 22 L177 36 L194 22" fill="none" stroke="#6366f1" stroke-width="3"/>
  </g>
</svg>
